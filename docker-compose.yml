version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: typeform_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/typeform.db
      - ALLOWED_ORIGINS=*
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

